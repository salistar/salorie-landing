name: Deploy firebase-token endpoint

# Deploys the Clerk->Firebase token endpoint container on the same Hetzner VPS
# as the landing. The image is built by the salistar/salorie repo CI and pushed
# to GHCR; here we only (re)deploy it. Secrets reused from this repo:
#   VPS_HOST, VPS_USER, VPS_SSH_KEY, GHCR_PAT  (already used by deploy.yml)
#   FIREBASE_TOKEN_ENV  (the firebase-token .env contents — add this one)
on:
  # Manual only — run from the Actions tab AFTER the FIREBASE_TOKEN_ENV secret
  # is set, so it never deploys an env-less (crash-looping) container.
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Hetzner VPS
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        # Pass the secret as an ENV VAR (not ${{ }} literal substitution) so the
        # multi-line JSON with embedded quotes is written intact on the remote.
        env:
          FIREBASE_TOKEN_ENV: ${{ secrets.FIREBASE_TOKEN_ENV }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: FIREBASE_TOKEN_ENV
          script: |
            set -e
            mkdir -p ~/apps/salorie-landing
            cd ~/apps/salorie-landing
            if [ -d .git ]; then
              git fetch --all
              git reset --hard origin/main
            else
              git clone https://github.com/salistar/salorie-landing.git .
            fi
            # Write the endpoint secrets from the forwarded env var (safe with quotes/newlines).
            printf '%s' "$FIREBASE_TOKEN_ENV" > firebase-token.env
            chmod 600 firebase-token.env
            # Image is public on GHCR -> anonymous pull, no docker login needed.
            docker compose -f docker-compose.firebase-token.yml pull
            docker compose -f docker-compose.firebase-token.yml up -d --remove-orphans
            sleep 4
            docker compose -f docker-compose.firebase-token.yml ps
            # Sanity: the container should answer /health on its localhost port.
            curl -fsS http://127.0.0.1:4004/health && echo " <- firebase-token healthy"
