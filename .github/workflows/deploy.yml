name: Build and Deploy salorie.salistar.com

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'tsconfig.json'
      - 'postcss.config.js'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  deploy:
    name: Deploy to Hetzner VPS
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            mkdir -p ~/apps/salorie-landing
            cd ~/apps/salorie-landing
            if [ -d .git ]; then
              git fetch --all
              git reset --hard origin/main
            else
              git clone https://github.com/salistar/salorie-landing.git .
            fi
            # Build the image on the VPS from source (no GHCR auth / no GHCR_PAT needed).
            docker compose up -d --build --remove-orphans
            docker image prune -af --filter "until=72h"
            sleep 5
            docker compose ps

  cloudflare-purge:
    name: Purge Cloudflare cache
    needs: deploy
    runs-on: ubuntu-latest
    env:
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - name: Purge cache for salorie.salistar.com
        run: |
          if [ -z "$CF_ZONE_ID" ] || [ -z "$CF_API_TOKEN" ]; then
            echo "Cloudflare secrets missing, skipping cache purge"
            exit 0
          fi
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"hosts":["salorie.salistar.com"]}'

  health-check:
    name: Verify deployment
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      # Cette etape se terminait par `|| echo "Site not yet reachable"` : elle ne
      # pouvait donc JAMAIS echouer, et un deploiement cassE serait passE au vert.
      # Elle interrogeait aussi salorie.salistar.com, alors que le domaine public est
      # salorie.com. On verifie desormais les DEUX pages qui comptent — l'accueil et
      # /delete-account, exigee par Google Play — avec des tentatives espacees, le
      # conteneur pouvant mettre quelques secondes a repondre.
      - name: Verifier que la landing repond publiquement
        run: |
          for page in "https://salorie.com/" "https://salorie.com/delete-account"; do
            ok=0
            for i in $(seq 1 15); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$page" || echo 000)
              echo "$page essai $i : HTTP $code"
              if [ "$code" = "200" ]; then ok=1; break; fi
              sleep 6
            done
            if [ "$ok" != "1" ]; then
              echo "::error::$page ne repond pas 200 apres le deploiement."
              exit 1
            fi
          done
