name: Build and Deploy salorie.salistar.com

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'tsconfig.json'
      - 'postcss.config.js'
      - 'Dockerfile'
      - 'docker-compose.yml'
      # C'est docker-compose.srv3.yml que le job execute, pas le compose par
      # defaut : sans lui dans cette liste, une modification du fichier qui
      # construit reellement le conteneur ne declencherait aucun deploiement.
      - 'docker-compose.srv3.yml'
      # Instrumentation Sentry : le DSN est embarque au BUILD (variables
      # NEXT_PUBLIC_*), donc toute modification de ces fichiers exige un
      # redeploiement pour atteindre le navigateur.
      - 'instrumentation*.ts'
      - 'sentry.*.config.ts'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  deploy:
    name: Deploy to Hetzner VPS
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/apps/salorie-landing
            # Le repertoire doit deja etre un depot git : un `git clone` echouerait ici
            # (dossier non vide) et, surtout, un repertoire inattendu signale qu'on n'est
            # PAS sur le bon serveur. Le 5 aout 2026, ce workflow tournait sur srv2 tandis
            # que salorie.com est servi depuis srv3 : il reconstruisait consciencieusement
            # une image que personne n'interrogeait, et se declarait vert.
            test -d .git || { echo "::error::~/apps/salorie-landing n'est pas un depot git — mauvais serveur ?"; exit 1; }
            git fetch --all
            git reset --hard origin/main

            # docker-compose.srv3.yml, PAS le compose par defaut : c'est lui qui produit
            # l'image `salorie-landing:latest` sur le reseau `edge`, celle que Caddy sert.
            docker compose -f docker-compose.srv3.yml up -d --build --remove-orphans
            docker image prune -af --filter "until=72h"
            sleep 20
            docker compose -f docker-compose.srv3.yml ps

            # Le conteneur doit tourner sur l'image qu'on vient de construire, et non sur
            # une image plus ancienne restee en place.
            img=$(docker inspect salorie-landing --format '{{.Config.Image}}')
            echo "image du conteneur : $img"
            test "$img" = "salorie-landing:latest" || { echo "::error::le conteneur tourne sur $img"; exit 1; }

  cloudflare-purge:
    name: Purge Cloudflare cache
    needs: deploy
    runs-on: ubuntu-latest
    env:
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
    steps:
      - name: Purge cache for salorie.salistar.com
        run: |
          if [ -z "$CF_ZONE_ID" ] || [ -z "$CF_API_TOKEN" ]; then
            echo "Cloudflare secrets missing, skipping cache purge"
            exit 0
          fi
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"hosts":["salorie.salistar.com"]}'

  health-check:
    name: Verify deployment
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      # Cette etape se terminait par `|| echo "Site not yet reachable"` : elle ne
      # pouvait donc JAMAIS echouer, et un deploiement casse serait passe au vert.
      # On verifie donc les DEUX pages qui comptent — l'accueil et
      # /delete-account, exigee par Google Play — avec des tentatives espacees, le
      # conteneur pouvant mettre quelques secondes a repondre.
      #
      # ⚠ ET ON VERIFIE SALORIE.SALISTAR.COM, PAS SALORIE.COM.
      # Elle a interroge salorie.com un temps, au motif que « le domaine public
      # est salorie.com ». C'est vrai, et c'est justement le piege : depuis la
      # fusion de la landing dans `web/app/(landing)`, Caddy sert
      # `salorie.com` par `salorie-web` — un conteneur d'un AUTRE depot, que ce
      # workflow ne construit pas et ne redemarre pas. Ce depot-ci ne sert que
      # `salorie.salistar.com` (`reverse_proxy salorie-landing:3000`).
      #
      # Consequence, constatee le 10/09/2026 : ce deploiement a echoue en rouge
      # alors que son propre conteneur tournait — salorie-web etait en 500 pour
      # une raison sans aucun rapport. Une verification qui accuse le voisin ne
      # verifie rien.
      # ⚠ ON N'ATTEND PLUS 200 : CE SITE REDIRIGE.
      # Depuis le 10/09/2026, tout part vers salorie.com en 308 (cf. l'entete de
      # `next.config.ts`). Exiger 200 ferait echouer chaque deploiement.
      #
      # Mais « ca redirige » ne suffit pas comme controle : une redirection vers
      # une page morte passerait au vert. On verifie donc les DEUX bouts — le
      # 308 ici, et le 200 a l'arrivee, en suivant le saut. Les deux chemins
      # testes sont ceux qui comptent : l'accueil, et /delete-account, exigee
      # par Google Play et deposee telle quelle a la console.
      - name: Verifier que la redirection mene quelque part
        run: |
          for chemin in "/" "/delete-account"; do
            page="https://salorie.salistar.com$chemin"
            ok=0
            for i in $(seq 1 15); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$page" || echo 000)
              cible=$(curl -s -o /dev/null -w '%{redirect_url}' --max-time 10 "$page" || echo "")
              echo "$page essai $i : HTTP $code -> $cible"
              case "$code" in
                30[178])
                  case "$cible" in
                    https://salorie.com$chemin*) ok=1 ;;
                    *) echo "::error::redirige vers $cible, pas vers salorie.com$chemin" ; exit 1 ;;
                  esac
                  ;;
              esac
              [ "$ok" = "1" ] && break
              sleep 6
            done
            if [ "$ok" != "1" ]; then
              echo "::error::$page ne redirige pas apres le deploiement (dernier code : $code)."
              exit 1
            fi
            # Et l'arrivee doit exister : une redirection vers un 404 serait pire
            # que pas de redirection du tout.
            arrivee=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 15 "$page" || echo 000)
            echo "$page suivie jusqu au bout : HTTP $arrivee"
            if [ "$arrivee" != "200" ]; then
              echo "::error::la cible de $page rend $arrivee, pas 200."
              exit 1
            fi
          done
