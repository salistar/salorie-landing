services:
  salorie-landing:
    # Built on the VPS from source (no GHCR auth needed).
    build: .
    image: ghcr.io/salistar/salorie-landing:latest
    container_name: salorie-landing
    restart: always
    ports:
      - '127.0.0.1:4003:3000'
    environment:
      NODE_ENV: production
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - salistar-network

networks:
  salistar-network:
    name: salistar-network
    external: true
